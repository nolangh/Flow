name: CI

on:
  push:
    branches: [main, master, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Type-check + Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Biome
        run: npx biome check .

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Unit + Integration tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          # Disable live service calls in tests
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Security — dependency vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm audit — fail on high/critical severity
      - name: npm audit
        run: npm audit --audit-level=high

      # Snyk — deeper analysis including transitive deps and license issues
      # Requires SNYK_TOKEN secret in repo settings (free at snyk.io)
      # continue-on-error: true so CI doesn't fail if SNYK_TOKEN is not yet configured
      - name: Snyk vulnerability scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all

      # Snyk monitor — upload snapshot to Snyk dashboard for ongoing tracking
      # Only runs on pushes to main (not PRs) to avoid duplicate projects
      - name: Snyk monitor
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Supabase migrations — lint SQL for common mistakes
  # ─────────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Squawk (PostgreSQL migration linter)
        run: npm install -g squawk-cli

      # Squawk checks migrations for:
      #  - missing NOT NULL constraints added without a default
      #  - adding a column without a default on large tables (table rewrites)
      #  - dropping columns/tables without checking dependents
      #  - missing RLS on new tables
      - name: Lint migrations
        run: squawk supabase/migrations/*.sql
        continue-on-error: true   # advisory — doesn't block merge
